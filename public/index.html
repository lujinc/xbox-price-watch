<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Xbox 低价区特价 · 土耳其 / 阿根廷区折扣榜</title>
<meta name="description" content="查看 Xbox 土耳其区（TRY）与阿根廷区（ARS）的打折游戏，原价、折扣价、折扣幅度一目了然，一键跳转官方商店。每日自动更新。" />
<meta name="theme-color" content="#ffffff" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23107c10'/%3E%3Ctext x='16' y='22' font-size='17' font-family='system-ui' font-weight='700' fill='white' text-anchor='middle'%3EX%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="./style.css?v=1" />
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="./" aria-label="Xbox 土耳其区特价">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
          <path d="M5.5 5.5l13 13M18.5 5.5l-13 13"/>
        </svg>
      </span>
      <span class="brand-text">
        <strong id="brandName">Xbox 土耳其区</strong>
        <small id="brandSub">Türkiye Store · TRY</small>
      </span>
    </a>

    <div class="search" role="search">
      <svg class="search-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
      </svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="搜索游戏：双人成行、Elden Ring、Forza…" aria-label="搜索游戏" />
      <button id="qClear" class="q-clear" type="button" hidden aria-label="清空">×</button>
      <kbd>/</kbd>
    </div>

    <div class="top-actions">
      <div class="region-switch" id="regionSwitch" role="group" aria-label="切换市场">
        <button type="button" data-region="tr" aria-label="土耳其区 TRY"><b>TR</b><i>TRY</i></button>
        <button type="button" data-region="ar" aria-label="阿根廷区 ARS"><b>AR</b><i>ARS</i></button>
      </div>
      <button id="refresh" class="btn" type="button" title="重新读取最新数据">
        <svg class="icon-refresh" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round">
          <path d="M20 11a8 8 0 10-2.6 5.9"/><path d="M20 5v6h-6"/>
        </svg>
        <span>刷新</span>
      </button>
    </div>
  </div>
</header>

<main class="wrap">

  <section class="hero">
    <div class="hero-main">
      <h1 id="heroTitle">土耳其区正在打折</h1>
      <p id="heroSub">正在读取官方商店数据…</p>
    </div>
    <div class="hero-stats" id="heroStats">
      <div class="stat"><b id="statDeals">–</b><span>款打折</span></div>
      <div class="stat"><b id="statMax">–</b><span>最高折扣</span></div>
      <div class="stat"><b id="statCount">–</b><span>款在库</span></div>
    </div>
  </section>

  <div class="toolbar">
    <nav class="tabs" id="tabs" aria-label="视图切换">
      <button type="button" data-tab="deals" class="active">正在打折<em id="tabDealsCount"></em></button>
      <button type="button" data-tab="hot">热门榜</button>
      <button type="button" data-tab="all">全部游戏</button>
    </nav>

    <div class="controls">
      <div class="chips" id="chips">
        <button type="button" data-disc="0" class="active">全部折扣</button>
        <button type="button" data-disc="30">30%+</button>
        <button type="button" data-disc="50">50%+</button>
        <button type="button" data-disc="70">70%+</button>
        <span class="chip-sep" aria-hidden="true"></span>
        <button type="button" data-plat="all" class="active">全平台</button>
        <button type="button" data-plat="Xbox">Xbox</button>
        <button type="button" data-plat="PC">PC</button>
      </div>
      <label class="sortbox">
        <span>排序</span>
        <select id="sort">
          <option value="hot" selected>热门优先</option>
          <option value="discount">折扣最高</option>
          <option value="save">省得最多</option>
          <option value="priceAsc">价格从低到高</option>
          <option value="priceDesc">价格从高到低</option>
          <option value="ending">即将结束</option>
        </select>
      </label>
    </div>
  </div>

  <div class="resultbar"><span id="resultCount"></span></div>

  <section class="grid" id="grid" aria-live="polite"></section>

  <div id="skeletons" class="grid skel-wrap"></div>

  <div id="empty" class="empty" hidden>
    <div class="empty-ico">🎮</div>
    <h3>没有匹配的游戏</h3>
    <p>换个关键词，或把折扣筛选放宽一点试试。</p>
  </div>

  <div id="sentinel" class="sentinel"></div>
  <div id="loadmoreWrap" class="loadmore-wrap" hidden>
    <button id="loadmore" class="btn-ghost" type="button">加载更多</button>
  </div>
</main>

<footer class="foot">
  <div class="foot-inner">
    <p id="footSource"><b>数据来源</b>：Xbox 官方商店土耳其区（market=TR，货币 TRY）目录接口，与 xbox.com/tr-TR 同源；人民币价按当日汇率折算，仅供参考。</p>
    <p id="footTip"><b>提示</b>：土耳其区属于低价区，结算通常需要土耳其地区支付方式，跨区购买请自行评估账号风险。最终价格以下单页为准。</p>
    <p><b>更新频率</b>：每天自动抓取一次，页面显示的是抓取时刻的价格，可能有延迟，下单前请以商店页面为准。</p>
  </div>
</footer>

<script src="./app.js?v=1"></script>
</body>
</html>
